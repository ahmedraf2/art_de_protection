<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campus Portal</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- ============ AUTH: LOGIN ============ -->
  <div id="login-screen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">🎓 Campus Portal</div>
      <p class="auth-sub">Sign in to your student account</p>
      <label>Username</label>
      <input id="li-user" placeholder="username" autocomplete="username" />
      <label>Password</label>
      <input id="li-pass" type="password" placeholder="password" autocomplete="current-password" />
      <div id="li-error" class="form-error"></div>
      <button class="btn-primary btn-block" onclick="doLogin()">Sign in</button>
      <p class="auth-switch">Don't have an account? <a onclick="showRegister()">Create one</a></p>
    </div>
  </div>

  <!-- ============ AUTH: REGISTER ============ -->
  <div id="register-screen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-brand">🎓 Campus Portal</div>
      <p class="auth-sub">Create your student account</p>
      <label>Full name</label>
      <input id="rg-name" placeholder="Your name" />
      <label>Username</label>
      <input id="rg-user" placeholder="choose a username" />
      <label>Email</label>
      <input id="rg-email" placeholder="you@campus.edu" />
      <label>Password</label>
      <input id="rg-pass" type="password" placeholder="choose a password" />
      <label>Account type</label>
      <input value="Student" disabled />
      <div id="rg-error" class="form-error"></div>
      <button class="btn-primary btn-block" onclick="doRegister()">Create account</button>
      <p class="auth-switch">Already have an account? <a onclick="showLogin()">Sign in</a></p>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand">🎓 <span>Campus Portal</span></div>
      <div class="topbar-right">
        <span class="welcome">Welcome, <b id="tb-name">—</b></span>
        <div class="usermenu">
          <button class="avatar" id="avatar" onclick="toggleMenu(event)">?</button>
          <div class="dropdown hidden" id="dropdown">
            <a onclick="nav('profile')"><span>👤</span> Profile</a>
            <a onclick="doLogout()"><span>⎋</span> Logout</a>
          </div>
        </div>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar"></aside>
      <main id="content"></main>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
